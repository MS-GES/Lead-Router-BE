
[project]
name = "privyr-webhook"
version = "0.1.0"
description = ""
authors = [
    {name = "raisalrasheed-kitaab", email = "raisal.rasheed@kitaab.ai"}
]
requires-python = ">=3.12"
dependencies = [
    "fastapi (>=0.156.4,<0.157.0)",
    "uvicorn (>=0.54.0,<0.55.0)",
    "python-dotenv (>=1.2.4,<2.0.0)",
    "google-genai (>=2.32.0,<3.0.0)",
    "pydantic-settings (>=2.16.1,<3.0.0)",
    "google-api-python-client (>=2.201.0,<3.0.0)" ,
    "google-auth-httplib2 (>=0.4.4,<0.5.0)" ,
    "google-auth-oauthlib (>=1.5.0,<2.0.0)",
    "dotenv (>=0.9.9,<0.10.0)"
]

[tool.uv]
package = false

[tool.poetry]
packages = [
    { include = "src" }
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)"
]
